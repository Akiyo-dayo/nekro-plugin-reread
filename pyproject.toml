[project]
name = "nekro-plugin-reread"
version = "1.0.0"
description = "NekroAgent 复读姬：跟读文本/图片/表情，可配置阈值、概率、打断与屏蔽"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Akiyo-dayo" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.ruff]
line-length = 128
target-version = "py310"
